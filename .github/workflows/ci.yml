# Runs every check on each push and pull request:
# lint, unit tests, API tests on a real database, both builds, and the browser tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://lms:lms@localhost:5432/lms_test
      UI_TEST_DATABASE_URL: postgresql://lms:lms@localhost:5432/lms_ui_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Create the test databases
        run: |
          PGPASSWORD=lms psql -h localhost -U lms -d lms -c "CREATE DATABASE lms_test;"
          PGPASSWORD=lms psql -h localhost -U lms -d lms -c "CREATE DATABASE lms_ui_test;"

      - name: Install
        run: |
          npm ci --prefix apps/api
          npm ci --prefix apps/web

      - name: API lint
        run: npm --prefix apps/api run lint

      - name: API unit tests (business rules)
        run: npm --prefix apps/api test

      - name: Web unit tests
        run: npm --prefix apps/web test -- --watch=false

      - name: Build
        run: npm run build

      - name: API docs are up to date
        run: |
          npm --prefix apps/api run docs:export
          git diff --exit-code docs/openapi.json || (echo "Run: npm --prefix apps/api run build && npm --prefix apps/api run docs:export, then commit docs/openapi.json" && exit 1)

      - name: API end-to-end tests
        run: npm --prefix apps/api run test:e2e

      - name: Install Chromium for the browser tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm --prefix apps/web run e2e

      - name: Upload the browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e-report/
            apps/web/e2e-results/
          retention-days: 14
